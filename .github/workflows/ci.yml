name: ci
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.10", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r requirements/base.txt pytest ruff
      - run: ruff check shared datasets scripts
      - run: pytest -q
      - run: python scripts/scaffold.py --dry-run
      - name: Gate built notebooks (G1–G11)
        run: python scripts/validate.py --all --built-only
