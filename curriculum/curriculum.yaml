          - {n: 3, title: "Elastic Net", band: P1, goal: predict, gds: 4, subject: "Correlated biomarker groups", dataset: screening, refs: [esl2009], visuals: 6, experiments: ["constraint regions", "mixing sweep", "grouped selection"]}
      - slug: bayesian_linear
        title: Bayesian Linear Regression
        notebooks:
          - {n: 1, title: "Uncertainty Quantification", band: P3, goal: explain, gds: 4, subject: "Only 40 patients in a pilot — how sure is the dose effect?", dataset: trial, visuals: 7, experiments: ["prior→posterior", "intervals widen away from data", "informative vs flat"]}
      - slug: quantile
        title: Quantile Regression
        notebooks:
          - {n: 1, title: "Conditional Quantiles", band: P4, goal: predict, gds: 4, subject: "90th-percentile LOS for bed planning, not the mean", dataset: admissions, visuals: 6, experiments: ["10th/50th/90th", "vs OLS", "pinball loss"]}
      - slug: robust
        title: Robust Regression
        notebooks:
          - {n: 1, title: "RANSAC & Huber", band: P2, goal: decide, gds: 4, subject: "Admissions with 10% data-entry corruption", dataset: admissions, visuals: 7, experiments: ["RANSAC inlier mask", "Huber ε sweep", "outlier fraction stress"]}
      - slug: isotonic
