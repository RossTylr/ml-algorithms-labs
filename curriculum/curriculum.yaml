          - {n: 2, title: "Assumptions & Diagnostics", band: P2, goal: decide, gds: 4, subject: "Same with heteroscedastic LOS, curvature, heavy tails", dataset: admissions, refs: [shalizi2024, esl2009], visuals: 8, experiments: ["clean diagnostics", "fan residuals → log fix", "one 90-day stay pulls the line"]}
      - slug: multiple_linear
        title: Multiple Linear Regression
        notebooks:
          - {n: 1, title: "Multivariate Extension", band: P2, goal: explain, gds: 4, subject: "LOS from all admission features", dataset: admissions, visuals: 7, experiments: ["coefficient interpretation", "standardised vs raw", "added-variable plots"]}
          - {n: 2, title: "Multicollinearity & VIF", band: P1, goal: explain, gds: 4, subject: "Two correlated biomarkers — disentangling", dataset: screening, visuals: 6, experiments: ["VIF", "bootstrap instability", "drop one / PCA"]}
