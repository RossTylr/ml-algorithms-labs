# ML Mastery — Curriculum Manifest (Health Data Science edition)
# Single source of truth. scripts/scaffold.py generates the tree, READMEs and notebook stubs from this file.
# scripts/validate.py checks every built notebook against `gates:`.
#
# Design calls recorded here (27 Oct 26):
#   D1  Every notebook teaches one ML method through one clinical problem. Method first, clinic second —
#       but the clinic is never decoration: the experiment answers a question a clinician would ask.
#   D2  Priority bands order the clinical framing: P1 diagnostics, P2 treatment, P3 efficacy,
#       P4 health tech / operations, P5 military-medicine thread (woven through, never a separate module).
#   D3  Where a notebook recreates a known study it says so in `study:` — "in the spirit of", synthetic
#       data, published effect sizes as targets. Never claims to reproduce the paper's numbers.
#   D4  Ten companion datasets, all synthetic, all clinical, generated from `datasets/` with SEED=42.
#       Real benchmark sets (MIMIC-style, PhysioNet, UCI Wisconsin) are referenced for context only.
#   D5  Military-medicine subjects use generic doctrine terms (point of injury, Role 1/2/3, MASCAL,
#       evacuation chain) so they are learnable without service background.

meta:
  name: ml-algorithms-labs
  version: 0.3.0
  domain: health data science
  registers: ["🗣️ Plain", "💻 Developer", "🔬 Technical"]
  seed: 42

priority_bands:
  P1: {name: Diagnostics,     question: "Does this person have the condition? How sure are we?"}
  P2: {name: Treatment,       question: "What should we do for this person, and what will happen if we do?"}
  P3: {name: Efficacy,        question: "Did the intervention work, for whom, and by how much?"}
  P4: {name: Health tech,     question: "Can the system run safely, at scale, in real time?"}
  P5: {name: Military thread, question: "Does it hold under austerity, mass casualty and a hostile clock?"}

gates:
  G1:  "Title cell carries module, topic, notebook number, prerequisites, time estimate, priority band"
  G2:  "Learning objectives cell with 3–5 bullets"
  G3:  "Setup cell imports shared.plotting.set_style and sets SEED = 42"
  G4:  "All three register markers (🗣️ 💻 🔬) appear in markdown"
  G5:  "Minimum figure count met (per-notebook `visuals`, default 7)"
  G6:  "Section headed 'Failure Modes' exists"
  G7:  "Section headed 'Results, Findings & Implications' with 📊 🔍 💡 ⚠️ sub-blocks"
  G8:  "Section headed 'Clinical Reading' — what the result means at the bedside / in the field"
  G9:  "Section headed 'Connections' exists"
  G10: "Section headed 'Key Takeaways' with 3–5 bullets"
  G11: "No local import other than shared/ and datasets/"
  G12: "Executes clean under nbconvert --execute (optional, --execute flag)"

datasets:
  # All generated. Loader signatures in datasets/__init__.py.
  screening:   {loader: load_screening,   band: P1, domain: "biomarker panel + ground-truth disease status; sensitivity/specificity known by construction", in_spirit_of: "UCI Wisconsin breast cancer; Framingham risk cohort"}
  admissions:  {loader: load_admissions,  band: P2, domain: "acute admissions — age, severity, comorbidity, department, LOS, 30-day readmission, mortality", in_spirit_of: "MIMIC-style admission tables; NHS SUS"}
  trial:       {loader: load_trial,       band: P3, domain: "two-arm RCT with covariates, adherence, outcome, time-to-event; true effect known", in_spirit_of: "SPRINT / ISIS-2 style trial structure"}
  vitals:      {loader: load_vitals,      band: P4, domain: "hourly HR, RR, SpO2, SBP, temp per patient over days; deterioration events labelled", in_spirit_of: "NEWS2 deterioration; PhysioNet sepsis challenge"}
  prescribing: {loader: load_prescribing, band: P2, domain: "per-patient medication baskets with comorbidity codes; adverse-event flags", in_spirit_of: "FAERS co-prescription signals; Charlson comorbidity"}
  cohort:      {loader: load_cohort,      band: P1, domain: "population health records with five latent risk segments", in_spirit_of: "population segmentation for proactive care"}
  notes:       {loader: load_notes,       band: P1, domain: "short triage / discharge free text with coded outcome", in_spirit_of: "ED triage note classification"}
  referrals:   {loader: load_referrals,   band: P4, domain: "referral network between clinicians, teams and sites", in_spirit_of: "care-pathway network analysis"}
  imaging:     {loader: load_imaging,     band: P1, domain: "synthetic 16×16 lesion patches, present/absent with shape and intensity variation", in_spirit_of: "patch-level lesion detection"}
  evac:        {loader: load_evac,        band: P5, domain: "casualty evacuation grid — point of injury → Role 1 → Role 2 under terrain, threat and clock", in_spirit_of: "medical evacuation planning"}
  areas:       {loader: load_areas,       band: P1, domain: "50 synthetic areas on a grid — population, expected counts, observed counts with spatial + unstructured risk; adjacency; facility sites", in_spirit_of: "BYM disease mapping; 2SFCA access"}
  ledger:      {loader: "ledger.jsonl + learn/digest.md", band: P4, domain: "this repo's own build record", in_spirit_of: "Donoho GDS6"}
  synthetic:   {loader: datasets.synthetic, band: all, domain: "controlled generators with known ground truth"}

tiers:
  1: "Build first — 00–06, 29."
  2: "Build second — 07–10, 15–16, 22."
  3: "Build as needed — everything else."

modules:

  # ═══════════════════════════ FOUNDATIONS ═══════════════════════════
  - id: "00"
    slug: mathematical_foundations
    title: Mathematical Foundations
    tier: 1
    prereqs: []
    purpose: "Every concept motivated by a clinical use. 'Why do I need this?' before 'What is this?'"
    topics:
      - slug: linear_algebra
        title: Linear Algebra
        notebooks:
          - {n: 1, title: "Vectors, Matrices & Operations", band: P1, goal: predict, gds: 3, subject: "A patient as a vector of biomarkers; a lab panel as a matrix; similarity between patients as a dot product", dataset: screening, refs: [deisenroth2020], visuals: 8, experiments: ["cosine similarity between patient vectors", "scaling the panel changes the geometry", "rank-deficient panels (redundant tests)"]}
          - {n: 2, title: "Eigenvalues & Decomposition", band: P1, goal: predict, gds: 3, subject: "Principal directions of variation in a biomarker cloud — which combinations of tests carry the signal", dataset: screening, refs: [deisenroth2020], visuals: 8, experiments: ["eigenvectors of the biomarker covariance", "rotate the panel, eigenvectors follow", "PCA is eigendecomposition — prove it"]}
          - {n: 3, title: "SVD & Low-Rank Approximation", band: P1, goal: predict, gds: 3, subject: "Compressing lesion patches — how many singular values preserve the lesion", dataset: imaging, study: "shannon1948", visuals: 7, experiments: ["reconstruct at rank 1/2/4/8", "storage vs diagnostic detail", "denoise a noisy patch"]}
      - slug: calculus
        title: Calculus
        notebooks:
          - {n: 1, title: "Derivatives & Gradients", band: P2, goal: decide, gds: 3, subject: "Dose-response surface — the steepest path to the therapeutic window", dataset: synthetic, refs: [deisenroth2020], visuals: 8, experiments: ["numeric vs analytic gradient", "gradient points to higher response", "saddle at the toxic/ineffective boundary"]}
          - {n: 2, title: "Chain Rule, Jacobians & Hessians", band: P2, goal: decide, gds: 3, subject: "A care pathway as composed functions — how a change at triage propagates to discharge", dataset: synthetic, visuals: 7, experiments: ["hand vs code gradients on a 3-stage pathway", "Newton vs GD on a 2-parameter outcome", "vanishing/exploding over long pathways"]}
      - slug: probability
        title: Probability
        notebooks:
          - {n: 1, title: "Probability Fundamentals & Bayes", band: P1, goal: explain, gds: 3, subject: "Screening a rare disease — prevalence, sensitivity, specificity, and what a positive result really means", dataset: screening, visuals: 8, study: "Gigerenzer natural-frequency reasoning", experiments: ["simulate 10k screens vs theory", "rare disease → most positives false", "posterior after 1/5/10/50 tests"]}
          - {n: 2, title: "Distributions & Sampling", band: P4, goal: predict, gds: 3, subject: "ED arrivals per hour (Poisson), LOS (log-normal), survival to event (exponential), test positivity (Binomial)", dataset: admissions, refs: [dekking2005, downey2024], visuals: 10, experiments: ["convergence at n=10..10k", "Binomial→Poisson for rare events", "fit and test goodness of fit on LOS"]}
          - {n: 3, title: "MLE & MAP Estimation", band: P1, goal: predict, gds: 3, subject: "Estimating a test's true positive rate from a validation sample", dataset: screening, refs: [murphy2022], visuals: 8, experiments: ["MLE convergence 5→1000 patients", "MAP with a published-prior vs flat", "MLE under a misspecified model"]}
      - slug: optimisation
        title: Optimisation
        notebooks:
          - {n: 1, title: "Gradient Descent Variants", band: P2, goal: decide, gds: 3, subject: "Fitting a risk score — batch, stochastic and mini-batch on a 10k-patient cohort", dataset: cohort, refs: [kochenderfer2019], visuals: 10, experiments: ["trajectories per variant", "learning-rate sweep to divergence", "batch size vs gradient noise"]}
          - {n: 2, title: "Constrained Optimisation", band: P4, goal: predict, gds: 3, subject: "Theatre scheduling — maximise cases under staff-hours and bed constraints", dataset: synthetic, visuals: 7, experiments: ["analytic vs numeric Lagrange", "add/remove a constraint", "duality gap"]}
      - slug: information_theory
        title: Information Theory
        notebooks:
          - {n: 1, title: "Entropy, Divergence & Mutual Information", band: P1, goal: explain, gds: 3, subject: "How much does each test tell you? Information gain of a biomarker about disease status", dataset: screening, study: "shannon1948", visuals: 8, experiments: ["entropy of outcome before/after a test", "KL between predicted and true risk distributions", "MI ranks tests", "information gain ↔ Gini"]}
      - slug: numerical_methods
        title: Numerical Methods
        notebooks:
          - {n: 1, title: "Stability, Precision & Solvers", band: P4, goal: predict, gds: 3, subject: "Where rounding kills — cumulative drug dosing, ill-conditioned risk models", dataset: synthetic, visuals: 7, experiments: ["catastrophic cancellation in cumulative dose", "condition number 10→1e6 on a risk model", "ridge term stabilises"]}

  - id: "01"
    slug: programming_data_foundations
    title: Programming & Data Foundations
    tier: 1
    prereqs: ["00"]
    purpose: "The Python patterns health data work requires."
    topics:
      - slug: python_patterns
        title: Python Patterns
        notebooks:
          - {n: 1, title: "Core Python for Health Data", band: P4, goal: predict, gds: 3, subject: "Processing an HL7-style event stream — count, filter, transform", dataset: synthetic, visuals: 7, experiments: ["list vs generator at 10M events", "loop vs comprehension vs NumPy", "pipeline from classes"]}
          - {n: 2, title: "Pythonic Patterns & Refactoring", band: P4, goal: predict, gds: 3, subject: "Refactor a 100-line audit script", dataset: synthetic, visuals: 5, experiments: ["lru_cache", "itertools.product grid", "monolith → dataclasses"]}
      - slug: numpy
        title: NumPy
        notebooks:
          - {n: 1, title: "Arrays, Broadcasting & Vectorisation", band: P1, goal: predict, gds: 3, subject: "A lesion patch as an array — windowing, contrast, thresholding", dataset: imaging, refs: [harris2020], visuals: 8, experiments: ["loop vs vectorised", "broadcasting shape matrix", "views vs copies"]}
          - {n: 2, title: "Linear Algebra, Random & einsum", band: P4, goal: predict, gds: 3, subject: "Bed-flow balance as Ax=b; Monte Carlo bed occupancy", dataset: synthetic, visuals: 6, experiments: ["solve by hand vs np", "occupancy at 100..100k draws", "einsum batch ops"]}
      - slug: pandas
        title: pandas
        notebooks:
          - {n: 1, title: "DataFrames & Core Operations", band: P2, goal: decide, gds: 1, subject: "An admissions extract with gaps and mixed types", dataset: admissions, visuals: 7, experiments: ["quality issues", "category memory", "method chain"]}
          - {n: 2, title: "GroupBy, Merge & Reshape", band: P4, goal: predict, gds: 1, subject: "Admissions by department × month; join to a staffing table", dataset: admissions, visuals: 7, experiments: ["multi-aggregation", "left-join NaNs", "pivot for reporting"]}
      - slug: visualisation
        title: Visualisation
        notebooks:
          - {n: 1, title: "Matplotlib, Seaborn & Plotly", band: P4, goal: predict, gds: 5, subject: "A week of vitals across a ward — which chart tells the story?", dataset: vitals, refs: [knaflic2015], visuals: 12, experiments: ["same data, 10 chart types", "default vs publication style", "plotly patient slider"]}
      - slug: data_wrangling
        title: Data Wrangling
        notebooks:
          - {n: 1, title: "Missing Values, Outliers & Coercion", band: P2, goal: decide, gds: 1, subject: "Deliberately messy admissions — MCAR/MAR/MNAR labs, impossible LOS, inconsistent dates", dataset: admissions, visuals: 8, experiments: ["inject each mechanism; compare imputers", "deletion vs mean vs KNN vs MICE on a LOS model", "remove vs cap vs log"]}
      - slug: sql
        title: SQL
        notebooks:
          - {n: 1, title: "SQL for Health Data", band: P4, goal: predict, gds: 1, subject: "Patients–admissions–prescriptions in DuckDB", dataset: prescribing, visuals: 6, experiments: ["filter→join→aggregate→window→CTE", "DuckDB vs SQLite", "pandas ↔ SQL"]}
      - slug: git
        title: Git
        notebooks:
          - {n: 1, title: "Git Workflows for Analysis", band: P4, goal: predict, gds: 3, subject: "Branching for model experiments; never committing PHI", dataset: synthetic, visuals: 5, experiments: ["branch/commit/merge", "repo bloat", "DVC on a large extract"]}
      - slug: reproducibility
        title: Reproducibility
        notebooks:
          - {n: 1, title: "Reproducible Clinical Analysis", band: P3, goal: explain, gds: 6, subject: "A trial analysis that gives different p-values each run — then fixing it", dataset: trial, refs: [chen2022], visuals: 5, experiments: ["unseeded differs", "seeded identical", "out-of-order cell bug"]}
      - slug: software_engineering
        title: Software Engineering
        notebooks:
          - {n: 1, title: "Testing, Modular Code & Packaging", band: P4, goal: predict, gds: 3, subject: "A 500-line risk-score script → tested package", dataset: synthetic, refs: [huyen2022], visuals: 5, experiments: ["pytest a preprocessor", "Hypothesis on a scaler", "extract/type/test"]}

  - id: "02"
    slug: statistical_foundations
    title: Statistical Foundations
    tier: 1
    prereqs: ["00", "01"]
    purpose: "Recognise, test and handle the assumptions every clinical model makes."
    topics:
      - slug: descriptive
        title: Descriptive Statistics
        notebooks:
          - {n: 1, title: "Central Tendency, Dispersion & Shape", band: P2, goal: decide, gds: 4, subject: "Length of stay across five departments — skewed, normal, bimodal", dataset: admissions, refs: [downey2024], visuals: 8, experiments: ["mean vs median LOS by dept", "5 extreme stays — which stats survive", "skew vs Normal fit"]}
      - slug: inferential
        title: Inferential Statistics
        notebooks:
          - {n: 1, title: "Hypothesis Testing Fundamentals", band: P3, goal: explain, gds: 4, subject: "Did the new discharge protocol cut LOS? Null, p-value, power", dataset: admissions, study: "wasserstein2016", refs: [amrhein2019], visuals: 9, experiments: ["10k null tests → uniform p", "real effect → p near 0", "small-n noise"]}
          - {n: 2, title: "Common Parametric Tests", band: P3, goal: explain, gds: 4, subject: "Three analgesia regimens; defect rates across three labs", dataset: trial, refs: [dekking2005], visuals: 8, experiments: ["t-test normal vs skewed", "t vs Mann-Whitney with outliers", "ANOVA → Tukey"]}
          - {n: 3, title: "Non-Parametric & Exact Tests", band: P3, goal: explain, gds: 4, subject: "Ordinal pain scores across sites; rare-event 2×2", dataset: trial, study: "ramdas2024", visuals: 6, experiments: ["Wilcoxon vs t", "Kruskal-Wallis → Dunn", "Fisher vs Chi²"]}
      - slug: distributions
        title: Distributions
        notebooks:
          - {n: 1, title: "Discrete Distributions", band: P4, goal: predict, gds: 4, subject: "Arrivals, test positives, trials to first readmission", dataset: admissions, visuals: 8, experiments: ["empirical vs PMF", "Binomial≈Poisson", "Poisson fit to arrivals"]}
          - {n: 2, title: "Continuous Distributions", band: P2, goal: decide, gds: 4, subject: "LOS (log-normal), time to event (exponential/Weibull), lab values (Normal), dosing (Gamma)", dataset: admissions, visuals: 10, experiments: ["Normal → Log-normal", "t at df 3/10/30/∞", "AIC/BIC across LOS fits"]}
      - slug: clt
        title: Central Limit Theorem
        notebooks:
          - {n: 1, title: "CLT Intuition & Implications", band: P3, goal: explain, gds: 4, subject: "Why trial mean outcomes are Normal even when individual outcomes aren't", dataset: trial, visuals: 8, experiments: ["six start distributions", "Cauchy never converges", "CI width vs n"]}
      - slug: correlation
        title: Correlation & Association
        notebooks:
          - {n: 1, title: "Measuring Relationships", band: P1, goal: explain, gds: 4, subject: "Biomarkers vs outcome — linear, monotonic, non-linear, spurious", dataset: screening, visuals: 8, experiments: ["Pearson/Spearman on 5 shapes", "Simpson's paradox by sex", "partial correlation removes age"]}
      - slug: ab_testing
        title: A/B Testing
        notebooks:
          - {n: 1, title: "Designing, Running & Interpreting Experiments", band: P4, goal: predict, gds: 6, subject: "Appointment-reminder redesign — DNA rate", dataset: synthetic, visuals: 8, experiments: ["10k A/A → 5% false positive", "2% lift power vs n", "daily peeking"]}
      - slug: resampling
        title: Resampling
        notebooks:
          - {n: 1, title: "Bootstrap, Permutation & Jackknife", band: P3, goal: explain, gds: 4, subject: "Median LOS reduction from 200 patients — how sure?", dataset: admissions, visuals: 7, experiments: ["bootstrap CI of median", "bootstrap vs parametric", "permutation between arms", "fails on the max"]}
      - slug: mle
        title: Maximum Likelihood
        notebooks:
          - {n: 1, title: "MLE in Practice", band: P1, goal: predict, gds: 4, subject: "Arrival rate; lab error; a risk score as MLE", dataset: screening, visuals: 7, experiments: ["analytic vs numeric λ", "convergence n=10..1000", "best Gaussian to skewed data"]}
      - slug: bayes_vs_freq
        title: Bayesian vs Frequentist
        notebooks:
          - {n: 1, title: "Two Philosophies, One Trial", band: P3, goal: explain, gds: 4, subject: "Drug efficacy — posterior vs confidence interval on the same data", dataset: trial, study: "box1976", visuals: 8, experiments: ["credible vs confidence at n=10/50/200", "prior helps at small n", "prior sensitivity"]}
      - slug: effect_sizes
        title: Effect Sizes
        notebooks:
          - {n: 1, title: "Practical vs Statistical Significance", band: P3, goal: explain, gds: 6, subject: "1 mmHg at p<0.001 — NNT, Cohen's d, minimal clinically important difference", dataset: trial, refs: [amrhein2019, ng2022], visuals: 7, experiments: ["d=0.05 significant at n=100k", "rank interventions by d not p", "publication bias simulation"]}

  - id: "03"
    slug: data_engineering
    title: Data Engineering Essentials
    tier: 1
    prereqs: ["01", "02"]
    purpose: "Every mistake here silently ruins everything downstream — and in health, downstream is a patient."
    topics:
      - slug: pipelines
        title: Pipelines
        notebooks:
          - {n: 1, title: "ETL, Validation & Contracts", band: P4, goal: predict, gds: 1, subject: "Daily vitals feed — extract, unit-convert, gap-fill, validate schema", dataset: vitals, refs: [chen2022, reddi2025], visuals: 6, experiments: ["3-step pipeline", "pandera catches an impossible SpO2", "idempotency"]}
      - slug: feature_engineering
        title: Feature Engineering
        notebooks:
          - {n: 1, title: "Numerical Transforms", band: P2, goal: decide, gds: 2, subject: "Admissions — LOS, age, comorbidity count → log, bins, interactions", dataset: admissions, study: "guyon2004", refs: [zheng2018], visuals: 8, experiments: ["log/sqrt/Box-Cox", "age×severity interaction", "degree-10 overfit"]}
          - {n: 2, title: "Temporal & Domain Features", band: P4, goal: predict, gds: 2, subject: "Vitals — cyclical hour-of-day, lags, rolling trends, NEWS2-style derived scores", dataset: vitals, refs: [zheng2018], visuals: 7, experiments: ["linear vs sin/cos hour", "lag 1/6/24h value", "rolling 6h trend"]}
      - slug: scaling
        title: Feature Scaling
        notebooks:
          - {n: 1, title: "Standardisation, Normalisation & Robust Scaling", band: P1, goal: predict, gds: 2, subject: "Biomarkers on wildly different units; KNN/SVM/RF with and without", dataset: screening, visuals: 7, experiments: ["raw vs scaled per model", "outliers: Standard vs Robust", "leakage from full-data fit"]}
      - slug: encoding
        title: Categorical Encoding
        notebooks:
          - {n: 1, title: "Encoding Strategies", band: P2, goal: decide, gds: 2, subject: "Department (5), diagnosis code (200), GP practice (very high cardinality)", dataset: admissions, visuals: 7, experiments: ["one-hot/target/frequency", "target-encoding leakage", "tree vs linear needs"]}
      - slug: splitting
        title: Train/Test Splitting
        notebooks:
          - {n: 1, title: "Leakage, Stratification & Temporal Splits", band: P2, goal: decide, gds: 1, subject: "Predict readmission — temporal order, imbalance, repeat patients", dataset: admissions, refs: [ng2022, huyen2022], visuals: 8, experiments: ["random vs temporal inflation", "deliberate target leakage (discharge destination)", "unstratified 95/5"]}
      - slug: imbalance
        title: Imbalanced Data
        notebooks:
          - {n: 1, title: "Resampling & Cost-Sensitive Learning", band: P5, goal: decide, gds: 1, subject: "Mass-casualty triage — 2% immediate, and the cost of missing one", dataset: synthetic, refs: [lakshmanan2021], visuals: 8, experiments: ["98% accuracy, 0% recall on T1", "SMOTE/weights/undersample", "PR-AUC vs ROC-AUC"]}
      - slug: eda
        title: Exploratory Data Analysis
        notebooks:
          - {n: 1, title: "Systematic Exploration", band: P1, goal: predict, gds: 1, subject: "A de-identified cohort extract with unlabelled columns — discover structure by method", dataset: cohort, refs: [donoho2017], visuals: 10, experiments: ["six-phase walk", "manual vs profiling", "hypotheses → simple models"]}

  # ═══════════════════════════ CORE SUPERVISED ═══════════════════════════
  - id: "04"
