      - slug: regularised
        title: Regularised Regression
        notebooks:
          - {n: 1, title: "Ridge", band: P1, goal: predict, gds: 4, subject: "A 50-biomarker panel, most weak", dataset: screening, refs: [esl2009], visuals: 7, experiments: ["paths vs α", "high-d vs OLS", "validation curve"]}
