# library/curated.yaml — the papers that notebooks cite (kind A method, B clinical, C critique) plus key references (D).
# Keys are what the manifest's `study:` and `refs:` fields point at. `file` is the path inside Ross's library folder.
# `reproduce` is the figure/claim the builder recreates on synthetic clinical data — "in the spirit of", never the paper's numbers.
# Everything not listed here is catalogued automatically as kind D from the folder listing (library/listing.txt).

