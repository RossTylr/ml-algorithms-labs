[project]
name = "ml-algorithms-labs"
version = "0.3.0"
description = "Every ML algorithm, taught through clinical problems. 30 modules, ~330 notebooks, three registers, gated."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Ross Taylor"}]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3",
  "matplotlib>=3.7", "seaborn>=0.12", "plotly>=5.15",
  "jupyter>=1.0", "notebook>=7.0", "nbformat>=5.9", "nbconvert>=7.0", "ipywidgets>=8.0",
  "pyyaml>=6.0", "tqdm>=4.65",
]

[project.optional-dependencies]
deep = ["torch>=2.0", "torchvision>=0.15"]
nlp = ["transformers>=4.30", "gensim>=4.3", "nltk>=3.8"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.0"]
bayes = ["pymc>=5.6", "arviz>=0.15", "numpyro>=0.12"]
graph = ["networkx>=3.1", "torch-geometric>=2.3"]
ts = ["statsmodels>=0.14", "prophet>=1.1", "darts>=0.25"]
anomaly = ["pyod>=1.1"]
rules = ["mlxtend>=0.23"]
xai = ["shap>=0.42", "lime>=0.2", "optuna>=3.3"]
survival = ["lifelines>=0.27", "scikit-survival>=0.22"]
causal = ["dowhy>=0.11", "econml>=0.15"]
dev = ["pytest>=8", "ruff>=0.4", "hypothesis>=6", "pandera>=0.18", "duckdb>=0.10"]
full = ["ml-algorithms-labs[deep,nlp,rl,bayes,graph,ts,anomaly,rules,xai,survival,causal,dev]"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
